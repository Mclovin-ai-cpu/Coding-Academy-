
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>Coding Academy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f2f5f9;
      color: #172b4d;
      font: 16px -apple-system, BlinkMacSystemFont, sans-serif;
    }
    header {
      background: #102a43;
      color: white;
      padding: 25px 20px;
    }
    main { max-width: 600px; margin: auto; padding: 16px; }
    h1 { font-size: 25px; margin: 0 0 8px; }
    h2 { font-size: 21px; }
    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px #0000000b;
    }
    .muted { color: #627d98; font-size: 14px; }
    .bar {
      height: 9px;
      background: #d9e2ec;
      border-radius: 9px;
      overflow: hidden;
      margin: 12px 0;
    }
    #fill { height: 100%; background: #16a34a; width: 0; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 13px;
      font-size: 16px;
      background: #176b87;
      color: white;
      cursor: pointer;
    }
    .lesson {
      display: block;
      width: 100%;
      text-align: left;
      background: white;
      color: #172b4d;
      border: 1px solid #d9e2ec;
      margin: 8px 0;
    }
    .lesson.done { border-left: 5px solid #16a34a; }
    .option {
      display: block;
      margin: 10px 0;
      padding: 12px;
      border: 1px solid #d9e2ec;
      border-radius: 10px;
    }
    .option input { margin-right: 8px; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #102a43;
      color: #e6f6ff;
      padding: 14px;
      border-radius: 10px;
      font-size: 13px;
    }
    #feedback { font-weight: 600; }
    footer { text-align: center; padding: 20px; }
  </style>
</head>
<body>
<header>
  <h1>Meine Coding Academy</h1>
  <div>Von der Geschäftsidee zur eigenen Web-App</div>
  <p class="muted" style="color:#d9e2ec">
    Basic · iPhone · 15–20 Minuten täglich
  </p>
</header>

<main>
  <section class="card">
    <h2>Dein Fortschritt</h2>
    <strong id="progress">0 von 10 Lektionen</strong>
    <div class="bar"><div id="fill"></div></div>
    <span class="muted" id="percent">0 % abgeschlossen</span>
  </section>

  <section class="card">
    <h2>Dein Lernpfad</h2>
    <div id="lessons"></div>
  </section>

  <section class="card" id="content">
    <h2>Willkommen!</h2>
    Wähle eine Lektion aus, um loszulegen.
  </section>
</main>

<footer class="muted">Deine Coding Academy · Version 1.0</footer>

<script>
const modules = [
  {
    title: "Die Welt der Websites",
    time: "15 Min.",
    text: "Eine Website besteht aus Dateien, die dein Browser anzeigt. Ein Server stellt diese Dateien im Internet bereit.",
    example: "Browser → Internet → Server → Website",
    question: "Was macht ein Browser?",
    answers: [
      "Er zeigt Websites an.",
      "Er ist eine Datenbank.",
      "Er ist ein Online-Shop."
    ],
    correct: 0,
    task: "Erkläre in eigenen Worten, was passiert, wenn du eine Website öffnest."
  },
  {
    title: "HTML – das Grundgerüst",
    time: "20 Min.",
    text: "HTML beschreibt den Inhalt einer Website. Tags kennzeichnen Überschriften, Absätze und Links.",
    example: "<h1>Meine Website</h1>\n<p>Willkommen!</p>",
    question: "Wofür steht HTML in diesem Kurs?",
    answers: [
      "Für die Gestaltung von Farben.",
      "Für die Struktur und den Inhalt.",
      "Für die Speicherung von Kundendaten."
    ],
    correct: 1,
    task: "Schreibe eine Überschrift und einen Absatz für deine eigene Website."
  },
  {
    title: "CSS – das Design",
    time: "20 Min.",
    text: "CSS gestaltet deine Website. Du kannst Farben, Schriftgrößen und Abstände verändern.",
    example: "h1 {\n  color: darkblue;\n  font-size: 28px;\n}",
    question: "Welche Aufgabe hat CSS?",
    answers: [
      "Es gestaltet die Website.",
      "Es verwaltet Bestellungen.",
      "Es ersetzt den Browser."
    ],
    correct: 0,
    task: "Ändere die Farbe einer Überschrift und beschreibe das Ergebnis."
  },
  {
    title: "JavaScript – die Logik",
    time: "20 Min.",
    text: "JavaScript macht Websites interaktiv. Mit Funktionen kannst du Aufgaben ausführen und Werte berechnen.",
    example: "let preis = 20;\nlet anzahl = 3;\nlet gesamt = preis * anzahl;",
    question: "Wofür kannst du JavaScript nutzen?",
    answers: [
      "Nur für Farben.",
      "Für interaktive Funktionen.",
      "Nur für Internetadressen."
    ],
    correct: 1,
    task: "Berechne den Gesamtpreis von zwei Produkten zu je 15 Euro."
  },
  {
    title: "Websites mit Daten",
    time: "20 Min.",
    text: "Eine Datenbank speichert Informationen. Eine API ermöglicht den Datenaustausch zwischen Programmen.",
    example: "Shop → API → Produktdatenbank",
    question: "Was speichert eine Datenbank?",
    answers: [
      "Nur Bilder.",
      "Informationen wie Produkte und Bestellungen.",
      "Nur Internetadressen."
    ],
    correct: 1,
    task: "Notiere drei Informationen, die ein Online-Shop speichern muss."
  },
  {
    title: "Deine Website veröffentlichen",
    time: "20 Min.",
    text: "Eine Domain ist die Internetadresse. Hosting stellt Speicherplatz und Server für deine Website bereit.",
    example: "Domain = Adresse\nHosting = Speicherplatz",
    question: "Was ist eine Domain?",
    answers: [
      "Die Internetadresse einer Website.",
      "Ein Designprogramm.",
      "Eine Datenbank."
    ],
    correct: 0,
    task: "Überlege dir eine passende Domain für deine zukünftige Geschäftsidee."
  },
  {
    title: "Online-Shop verstehen",
    time: "20 Min.",
    text: "Ein Shop benötigt Produktdaten, Warenkorb, Bestellprozess und eine Möglichkeit zur Bezahlung.",
    example: "Produkt → Warenkorb → Zahlung → Bestätigung",
    question: "Was gehört zum Bestellprozess?",
    answers: [
      "Nur die Startseite.",
      "Warenkorb und Bezahlung.",
      "Nur das Logo."
    ],
    correct: 1,
    task: "Zeichne den Ablauf eines Kaufs in deinem zukünftigen Shop."
  },
  {
    title: "Deine erste Web-App",
    time: "20 Min.",
    text: "Eine Web-App läuft im Browser und kann Funktionen wie Nutzerkonten oder gespeicherte Daten anbieten.",
    example: "Website + Interaktion + Daten = Web-App",
    question: "Was ist eine Web-App?",
    answers: [
      "Eine Anwendung im Browser.",
      "Ein Betriebssystem.",
      "Ein Kabel."
    ],
    correct: 0,
    task: "Beschreibe eine kleine Funktion, die deine spätere App haben könnte."
  },
  {
    title: "Mit KI programmieren",
    time: "20 Min.",
    text: "KI kann Code erklären, erstellen und Fehler analysieren. Du solltest den Code trotzdem verstehen und testen.",
    example: "Aufgabe → KI-Vorschlag → Prüfen → Testen",
    question: "Was solltest du mit KI-generiertem Code tun?",
    answers: [
      "Immer ungeprüft übernehmen.",
      "Verstehen und testen.",
      "Nie verändern."
    ],
    correct: 1,
    task: "Bitte eine KI, dir eine einfache HTML-Überschrift zu erklären."
  },
  {
    title: "Monetarisierung und Sicherheit",
    time: "20 Min.",
    text: "Apps können Geld durch Abos, Verkäufe oder Vermittlungsgebühren verdienen. Sicherheit und Datenschutz gehören von Anfang an dazu.",
    example: "Geschäftsmodell + Technik + Vertrauen",
    question: "Was ist bei einer App wichtig?",
    answers: [
      "Nur das Design.",
      "Geschäftsmodell, Sicherheit und Datenschutz.",
      "Nur möglichst viele Funktionen."
    ],
    correct: 1,
    task: "Notiere eine mögliche Einnahmequelle für deine spätere App."
  }
];

let completed = JSON.parse(
  localStorage.getItem("academyCompleted") || "[]"
);
let current = 0;
let answered = false;

function save() {
  localStorage.setItem(
    "academyCompleted",
    JSON.stringify(completed)
  );
}

function renderProgress() {
  const count = completed.length;
  const percent = Math.round(count / modules.length * 100);
  document.getElementById("progress").textContent =
    count + " von " + modules.length + " Lektionen";
  document.getElementById("percent").textContent =
    percent + " % abgeschlossen";
  document.getElementById("fill").style.width = percent + "%";
}

function renderLessons() {
  const list = document.getElementById("lessons");
  list.innerHTML = "";
  modules.forEach((m, i) => {
    const button = document.createElement("button");
    button.className = "lesson" +
      (completed.includes(i) ? " done" : "");
    button.textContent =
      (completed.includes(i) ? "✓ " : "") +
      (i + 1) + ". " + m.title + " · " + m.time;
    button.onclick = () => showLesson(i);
    list.appendChild(button);
  });
}

function showLesson(i) {
  current = i;
  answered = false;
  const m = modules[i];
  const content = document.getElementById("content");

  content.innerHTML = `
    <h2>Lektion ${i + 1}: ${m.title}</h2>
    <p class="muted">${m.time} · Basic</p>
    <p>${m.text}</p>
    <pre></pre>
    <h3>Deine Übung</h3>
    <p>${m.task}</p>
    <h3>Quiz</h3>
    <p>${m.question}</p>
    <div id="options"></div>
    <button id="check">Antwort prüfen</button>
    <p id="feedback"></p>
    <button id="finish" hidden>Lektion abschließen</button>
  `;

  content.querySelector("pre").textContent = m.example;
  const options = content.querySelector("#options");

  m.answers.forEach((answer, j) => {
    const label = document.createElement("label");
    label.className = "option";
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "answer";
    input.value = j;
    label.append(input, document.createTextNode(answer));
    options.appendChild(label);
  });

  content.querySelector("#check").onclick = checkAnswer;
}

function checkAnswer() {
  if (answered) return;
  const selected = document.querySelector(
    'input[name="answer"]:checked'
  );
  const feedback = document.getElementById("feedback");

  if (!selected) {
    feedback.textContent = "Bitte wähle eine Antwort aus.";
    return;
  }

  answered = true;
  const correct = Number(selected.value) === modules[current].correct;
  feedback.textContent = correct
    ? "Richtig! Sehr gut."
    : "Noch nicht ganz. Lies die Lektion noch einmal.";

  if (correct) {
    document.getElementById("finish").hidden = false;
  } else {
    answered = false;
  }
}

function finishLesson() {
  if (!completed.includes(current)) {
    completed.push(current);
  }
  save();
  renderProgress();
  renderLessons();

  const next = modules.findIndex((m, i) => !completed.includes(i));
  if (next >= 0) {
    showLesson(next);
  } else {
    document.getElementById("content").innerHTML =
      "<h2>Geschafft!</h2><p>Du hast alle Lektionen abgeschlossen. " +
      "Jetzt kannst du dein Wissen für ein eigenes Projekt nutzen.</p>";
  }
}

document.getElementById("content").addEventListener("click", event => {
  if (event.target.id === "finish") finishLesson();
});

renderProgress();
renderLessons();
showLesson(0);
</script>
</body>
</html>
