<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Academy">
<title>Coding Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--surface:#ffffff;--surface2:#eef1f7;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --accent:#4f46e5;--accent-soft:#eef0ff;--ok:#16a34a;--ok-soft:#e8f7ee;--warn:#d97706;--warn-soft:#fff4e0;--err:#dc2626;--err-soft:#fdecec;
  --k:#7c3aed;--s:#059669;--f:#2563eb;--c:#94a3b8;--t:#db2777;--n:#d97706;
  --code-bg:#0f172a;--code-text:#e2e8f0;--shadow:0 1px 2px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.06);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020;--surface:#121a2e;--surface2:#1a2440;--text:#e6edf7;--muted:#8b9bb7;--line:#24304d;
    --accent:#8b93ff;--accent-soft:#1d2350;--ok:#4ade80;--ok-soft:#12301f;--warn:#fbbf24;--warn-soft:#33270b;--err:#f87171;--err-soft:#3a1616;
    --k:#c4a1ff;--s:#5eead4;--f:#7cb8ff;--c:#64748b;--t:#f9a8d4;--n:#fcd34d;
    --code-bg:#070b16;--code-text:#e6edf7;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020;--surface:#121a2e;--surface2:#1a2440;--text:#e6edf7;--muted:#8b9bb7;--line:#24304d;
  --accent:#8b93ff;--accent-soft:#1d2350;--ok:#4ade80;--ok-soft:#12301f;--warn:#fbbf24;--warn-soft:#33270b;--err:#f87171;--err-soft:#3a1616;
  --k:#c4a1ff;--s:#5eead4;--f:#7cb8ff;--c:#64748b;--t:#f9a8d4;--n:#fcd34d;
  --code-bg:#070b16;--code-text:#e6edf7;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans)}
body{min-height:100vh;transition:background .25s,color .25s}
button,input,textarea,select{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
h1,h2,h3{margin:0;line-height:1.25}

/* ---------- App-Rahmen ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.path{font-family:var(--mono);font-size:15px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path .p{color:var(--accent)}
.cursor{display:inline-block;width:8px;height:16px;background:var(--accent);vertical-align:-2px;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.xpchip{font-family:var(--mono);font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:19px;height:19px}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:0;padding:6px 2px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;cursor:pointer;position:relative}
.nav button svg{width:23px;height:23px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.nav button.on{color:var(--accent);font-weight:600}
.nav button.on svg{transform:translateY(-2px) scale(1.08)}
.nav button.on::after{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:3px;background:var(--accent)}
.hide-nav .nav{transform:translateY(110%)}
.nav{transition:transform .25s}

/* ---------- Bausteine ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.label::before{content:"//";color:var(--accent)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;font-weight:650;cursor:pointer;
  background:var(--accent);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s,box-shadow .08s,filter .2s}
.btn:active,.btn.pressed{transform:translateY(3px);box-shadow:0 0 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface2);color:var(--text);box-shadow:0 3px 0 var(--line)}
.btn.ok{background:var(--ok);color:#06210f;box-shadow:0 3px 0 color-mix(in srgb,var(--ok) 55%,#000)}
.btn.danger{background:var(--err-soft);color:var(--err);box-shadow:0 3px 0 color-mix(in srgb,var(--err) 30%,transparent)}
.btn[disabled]{filter:grayscale(1);opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;transition:transform .1s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:8px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:10px;border-radius:10px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .7s cubic-bezier(.2,.9,.3,1)}
.tap{cursor:pointer;transition:transform .12s ease}
.tap:active,.tap.pressed{transform:scale(.975)}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.18;pointer-events:none;animation:rip .5s ease-out forwards}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.pos{position:relative;overflow:hidden}
input.field,textarea.field,select.field{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);outline:none;transition:border-color .2s}
input.field:focus,textarea.field:focus,select.field:focus{border-color:var(--accent)}
textarea.field{min-height:120px;resize:vertical;font-family:var(--mono);font-size:14px}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.view{animation:viewIn .32s cubic-bezier(.2,.9,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.section-title h2{font-size:18px}

/* ---------- Code-Block ---------- */
.code{background:var(--code-bg);color:var(--code-text);border-radius:16px;overflow:hidden;font-family:var(--mono);font-size:13px;margin:14px 0}
.code .bar-top{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.07);font-size:11px;color:#8b9bb7}
.code .dot{width:10px;height:10px;border-radius:50%}
.code pre{margin:0;padding:12px 0;overflow-x:auto;line-height:1.65}
.code .ln{display:block;padding:0 14px 0 0;white-space:pre}
.code .ln::before{content:attr(data-n);display:inline-block;width:34px;text-align:right;padding-right:12px;color:#475569;user-select:none}
.tk-k{color:#c4a1ff}.tk-s{color:#5eead4}.tk-c{color:#64748b;font-style:italic}.tk-t{color:#f9a8d4}.tk-n{color:#fcd34d}.tk-p{color:#7cb8ff}

/* ---------- Home ---------- */
.hello{margin:6px 2px 16px}
.hello h1{font-size:26px}
.hero{background:linear-gradient(135deg,#4f46e5,#2f6f8f 70%,#15803d);color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.8)}
.hero .tag{background:rgba(255,255,255,.18);color:#fff}
.hero .btn{background:#fff;color:#1e1b4b;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.course-mini{min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.course-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px;color:#fff;margin-bottom:10px}

/* ---------- Lernpfad ---------- */
.course{margin-bottom:22px}
.course-head{display:flex;align-items:center;gap:12px;margin:0 2px 12px}
.path-list{position:relative;padding-left:8px}
.path-list::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:2px;background:var(--line)}
.node{position:relative;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 0;margin-bottom:4px;border-radius:16px;background:none;border:0;width:100%;text-align:left;cursor:pointer}
.node .num{position:relative;z-index:1;flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:14px;background:var(--surface);border:2px solid var(--line);color:var(--muted);transition:transform .2s}
.node.done .num{background:var(--ok);border-color:var(--ok);color:#06210f}
.node.next .num{background:var(--accent);border-color:var(--accent);color:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.node .t{font-weight:600}
.node:active .num{transform:scale(.9)}
.node-body{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.node.next .node-body{border-color:var(--accent)}

/* ---------- Lektion ---------- */
.lesson-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.steps{display:flex;gap:6px;flex:1}
.steps i{flex:1;height:6px;border-radius:6px;background:var(--surface2);transition:background .3s}
.steps i.on{background:var(--accent)}
.steps i.done{background:var(--ok)}
.step-name{font-family:var(--mono);font-size:12px;color:var(--accent);margin-bottom:6px}
.lesson h1{font-size:24px;margin-bottom:12px}
.lesson p{margin:0 0 12px}
.term{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-size:13px;font-weight:600;border:0;cursor:pointer;margin:0 6px 8px 0;transition:transform .1s}
.term:active{transform:scale(.93)}
.tip{display:flex;gap:10px;background:var(--warn-soft);border-radius:16px;padding:14px;margin:14px 0;font-size:15px}
.tip b{color:var(--warn);font-family:var(--mono)}
.sticky-cta{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom));margin-top:18px;z-index:5}
.option{display:block;width:100%;text-align:left;padding:15px 16px;margin:10px 0;border-radius:16px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;transition:transform .1s,border-color .2s,background .2s}
.option:active{transform:scale(.98)}
.option.right{border-color:var(--ok);background:var(--ok-soft)}
.option.wrong{border-color:var(--err);background:var(--err-soft);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.feedback{border-radius:16px;padding:14px;margin-top:6px;font-size:15px;animation:viewIn .25s}
.feedback.ok{background:var(--ok-soft)}
.feedback.no{background:var(--err-soft)}

/* ---------- Karten ---------- */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .2s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.flip{perspective:1200px;height:300px;margin-bottom:16px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg)}
.face .big{font-family:var(--mono);font-size:30px;font-weight:700;margin:auto 0;text-align:center}
.ask{margin-top:14px}
.ask-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.answer{background:var(--surface2);border-radius:16px;padding:14px;margin-top:10px;animation:viewIn .25s;font-size:15px}
.answer .label{margin-bottom:4px}
.gl-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.gl-item b{font-family:var(--mono);font-size:14px}
.box-dots{display:flex;gap:3px}
.box-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.box-dots i.on{background:var(--ok)}

/* ---------- Projekte ---------- */
.todo{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;transition:opacity .3s}
.todo.done{opacity:.6}
.todo.done .todo-text{text-decoration:line-through}
.check{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:var(--surface2);display:grid;place-items:center;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.8,.5,1),background .2s}
.check svg{width:16px;height:16px;opacity:0;transform:scale(.3);transition:.2s}
.todo.done .check{background:var(--ok);border-color:var(--ok);transform:scale(1.08)}
.todo.done .check svg{opacity:1;transform:none;color:#06210f}
.todo-text{font-size:15px}
.todo-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mini{border:0;background:none;padding:4px;color:var(--muted);cursor:pointer;border-radius:8px}
.mini svg{width:20px;height:20px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none;transition:--p .6s}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px}
.note{border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;background:var(--surface2);border-radius:0 12px 12px 0;font-size:14px;white-space:pre-wrap}

/* ---------- Profil ---------- */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:14px 6px;border-radius:18px;background:var(--surface2);font-size:12px}
.badge .em{font-size:28px;display:block;margin-bottom:4px;filter:grayscale(1);opacity:.35}
.badge.on{background:var(--accent-soft)}
.badge.on .em{filter:none;opacity:1}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}

/* ---------- Sheet & Overlays ---------- */
.backdrop{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:50;opacity:0;transition:opacity .25s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1);max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:20px;margin-bottom:12px}
.sheet .fieldlabel{font-size:13px;font-weight:600;margin:14px 0 6px;display:block}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-20px);opacity:0;z-index:60;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;transition:.3s cubic-bezier(.3,1.5,.5,1);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.reward{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;animation:viewIn .3s}
.reward .burst{width:120px;height:120px;border-radius:36px;background:var(--ok);display:grid;place-items:center;animation:pop .6s cubic-bezier(.3,1.8,.5,1)}
.reward .burst svg{width:64px;height:64px;color:#06210f}
.reward .row{text-align:left}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}100%{transform:none}}
.reward h1{font-size:28px;margin:22px 0 6px}
.xp-big{font-family:var(--mono);font-size:40px;font-weight:700;color:var(--accent);margin:12px 0}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:71;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.newbadge{display:flex;align-items:center;gap:12px;background:var(--accent-soft);padding:12px 16px;border-radius:16px;margin:6px 0;text-align:left;animation:viewIn .4s both}
.newbadge .em{font-size:28px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="path" id="path"></div>
  <span class="xpchip" id="xpchip"></span>
  <button class="iconbtn" id="themeBtn" aria-label="Hell oder dunkel umschalten"></button>
</header>
<main id="view"></main>
<nav class="nav" id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   INHALTE
   ===================================================================== */
const COURSES = [
  { id:"web", title:"Wie das Web funktioniert", short:"Web-Grundlagen", ico:"</>", color:"#4f46e5",
    lessons:["web-basics","domain","html","css","js"] },
  { id:"tools", title:"Werkzeuge & Anbieter", short:"Tools", ico:"git", color:"#0891b2",
    lessons:["git","deploy","backend","payments"] },
  { id:"fw", title:"Frameworks & Bausteine", short:"Frameworks", ico:"{ }", color:"#db2777",
    lessons:["frameworks","stack","pwa"] },
  { id:"vibe", title:"Vibecoding mit KI", short:"Vibecoding", ico:"AI", color:"#7c3aed",
    lessons:["vibe","prompting","debugging","security"] },
  { id:"biz", title:"Business & Recht", short:"Business", ico:"€", color:"#16a34a",
    lessons:["legal","money","seo"] }
];

const L = (lines) => lines.join("\n");

const LESSONS = {
  "web-basics": { title:"Was passiert, wenn du eine Website öffnest?", min:10,
    intro:[
      "Wenn du eine Adresse eintippst, schickt dein Browser eine <b>Anfrage</b> (Request) ins Internet. Irgendwo steht ein <b>Server</b> – ein Computer, der rund um die Uhr läuft – und schickt die passenden Dateien zurück.",

const KEY="codingAcademy.v2";
const fresh=()=>({theme:"system",xp:0,done:{},practice:{},cards:{},reviewed:0,projects:[],days:[],badges:[],todosDone:0});
let S=fresh();
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
function touchDay(){const d=today(); if(!S.days.includes(d)){S.days.push(d); S.days=S.days.slice(-120);}}
function streak(){let n=0;const set=new Set(S.days);const d=new Date();
  if(!set.has(today())) d.setDate(d.getDate()-1);
  while(set.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1);} return n;}
const doneCount=()=>ALL.filter(id=>S.done[id]).length;
const level=()=>Math.floor(S.xp/200)+1;
const levelPct=()=>Math.round((S.xp%200)/2);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function buzz(ms=8){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest("button,.tap,.chip,.option,.node");
  if(!el) return; buzz();
  if(!el.classList.contains("pos")) return;
  const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height);
  const s=document.createElement("span");s.className="ripple";
  s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  el.appendChild(s); setTimeout(()=>s.remove(),520);
},{passive:true});

function confetti(){const cols=["#4f46e5","#16a34a","#f59e0b","#db2777","#06b6d4"];
  for(let i=0;i<60;i++){const c=document.createElement("i");c.className="confetti";
    c.style.left=Math.random()*100+"vw";c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.6+Math.random()*1.6)+"s";c.style.animationDelay=(Math.random()*.4)+"s";
    document.body.appendChild(c);setTimeout(()=>c.remove(),3600);}}

function openSheet(html,mount){
  closeSheet(true);
  const b=document.createElement("div");b.className="backdrop";b.id="bd";
  const s=document.createElement("div");s.className="sheet";s.id="sheet";s.setAttribute("role","dialog");
  s.innerHTML=`<div class="grab"></div>`+html;
  document.body.append(b,s);
  requestAnimationFrame(()=>{b.classList.add("show");s.classList.add("show");});
  b.onclick=()=>closeSheet();
  mount&&mount(s);
}
function closeSheet(instant){const b=$("#bd"),s=$("#sheet");if(!s)return;
  if(instant){b.remove();s.remove();return;}
  b.classList.remove("show");s.classList.remove("show");setTimeout(()=>{b.remove();s.remove();},300);}

function highlight(code,lang){
  const e=esc(code);
  if(!["html","css","js","jsx"].includes(lang)) return e;
  return e.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|&lt;!--[\s\S]*?--&gt;|&quot;[^\n]*?&quot;|&lt;\/?[a-zA-Z][\w-]*|&gt;|\b(?:const|let|function|return|await|async|if|else|import|export|from)\b|#[0-9a-fA-F]{3,6}\b|\b\d+(?:\.\d+)?\b)/g,m=>{
    if(m.startsWith("//")||m.startsWith("/*")||m.startsWith("&lt;!--")) return `<span class="tk-c">${m}</span>`;
    if(m.startsWith("&quot;")) return `<span class="tk-s">${m}</span>`;
    if(m.startsWith("&lt;")||m==="&gt;") return `<span class="tk-t">${m}</span>`;
    if(/^[a-z]+$/.test(m)) return `<span class="tk-k">${m}</span>`;
    return `<span class="tk-n">${m}</span>`;
  });
}
function codeBlock(c){
  const lines=highlight(c.text,c.lang).split("\n");
  return `<div class="code"><div class="bar-top"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span style="margin-left:8px">${esc(c.lang)}</span></div><pre>${lines.map((l,i)=>`<span class="ln" data-n="${i+1}">${l||" "}</span>`).join("")}</pre></div>`;
}

let LS=null; // Lektions-Zustand
function renderLesson(id){
  if(!LS||LS.id!==id) LS={id,step:0,q:0,firstTry:true,correct:0,answered:false};
  const L=LESSONS[id], c=courseOf(id);
  const names=["lernen","beispiel","praxis","quiz"];
  const v=$("#view");
  let body="";
  if(LS.step===0){
    body=`<div class="step-name">01 · ${names[0]}</div><h1>${esc(L.title)}</h1>
      ${L.intro.map(p=>`<p>${p}</p>`).join("")}
      <div class="label" style="margin-top:16px">Begriffe antippen</div>
      <div>${L.terms.map(t=>`<button class="term" data-term="${t}">${esc(CARDS[t].t)}</button>`).join("")}</div>`;
  } else if(LS.step===1){
    body=`<div class="step-name">02 · ${names[1]}</div><h1>So sieht das aus</h1>${codeBlock(L.code)}
      <div class="tip"><b>tipp</b><span>${esc(L.tip)}</span></div>`;
  } else if(LS.step===2){
    const projs=S.projects;
    body=`<div class="step-name">03 · ${names[2]}</div><h1>Deine Übung</h1>
      <p>${esc(L.task)}</p>
      <textarea class="field" id="prac" placeholder="Deine Antwort … (wird gespeichert)">${esc(S.practice[id]||"")}</textarea>
      ${projs.length?`<label class="fieldlabel" for="pracProj" style="display:block;margin:14px 0 6px;font-size:13px;font-weight:600">Auch in einem Projekt speichern (optional)</label>
        <select class="field" id="pracProj"><option value="">– kein Projekt –</option>${projs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>`
      :`<p class="small muted" style="margin-top:10px">Tipp: Lege im Reiter „Projekte“ eine Idee an, dann kannst du Übungen direkt dort sammeln.</p>`}
      <button class="btn ghost block" id="savePrac" style="margin-top:14px">${ic("check",'width="18" height="18"')} Übung speichern</button>`;
  } else {
    const Q=L.quiz[LS.q];
    body=`<div class="step-name">04 · ${names[3]} · Frage ${LS.q+1}/${L.quiz.length}</div><h1>${esc(Q.q)}</h1>
      <div id="opts">${Q.a.map((a,i)=>`<button class="option" data-i="${i}">${esc(a)}</button>`).join("")}</div><div id="fb"></div>`;
  }
  const cta = LS.step<3 ? `<button class="btn block" id="next">${LS.step===2?(S.practice[id]?"Weiter zum Quiz":"Überspringen & zum Quiz"):"Weiter"} ${ic("arrow",'width="18" height="18"')}</button>`
     : `<button class="btn ok block" id="next" ${LS.answered?"":"disabled"}>${LS.q<L.quiz.length-1?"Nächste Frage":"Lektion abschließen"} ${ic("arrow",'width="18" height="18"')}</button>`;
  v.innerHTML=`<div class="lesson">
    <div class="lesson-top"><button class="iconbtn" id="close" aria-label="Schließen">${ic("x")}</button>
      <div class="steps">${[0,1,2,3].map(i=>`<i class="${i<LS.step?"done":i===LS.step?"on":""}"></i>`).join("")}</div>
      <span class="tag acc">${esc(c.short)}</span></div>
    <div class="card">${body}</div>
    <div class="sticky-cta">${cta}</div></div>`;
  $("#close").onclick=()=>{LS=null;go("learn");};
  v.querySelectorAll("[data-term]").forEach(b=>b.onclick=()=>openCard(b.dataset.term));
  if(LS.step===2){
    $("#savePrac").onclick=()=>{
      const txt=$("#prac").value.trim(); if(!txt){toast("Schreib zuerst etwas 🙂");return;}
      const first=!S.practice[id]; S.practice[id]=txt;
      const pid=$("#pracProj")?.value;
      if(pid){const p=S.projects.find(x=>x.id===pid); p.notes.unshift({id:uid(),lesson:id,text:txt,date:today()});}
      save(); first?addXP(15,"Übung gespeichert"):toast(pid?"In Projekt gespeichert":"Aktualisiert");
      renderLesson(id);
    };
  }
  if(LS.step===3){
    const Q=L.quiz[LS.q];
    if(LS.answered){const b=v.querySelector(`[data-i="${Q.c}"]`);b.classList.add("right");$("#fb").innerHTML=`<div class="feedback ok"><b>Richtig!</b> ${esc(Q.why)}</div>`;}
    v.querySelectorAll(".option").forEach(b=>b.onclick=()=>{
      if(LS.answered) return;
      const i=+b.dataset.i;
      v.querySelectorAll(".option").forEach(o=>o.classList.remove("wrong"));
      if(i===Q.c){ b.classList.add("right"); LS.answered=true; buzz(20);
        if(LS.firstTry) LS.correct++;
        $("#fb").innerHTML=`<div class="feedback ok"><b>Richtig!</b> ${esc(Q.why)}</div>`;
        $("#next").removeAttribute("disabled");
      } else { void b.offsetWidth; b.classList.add("wrong"); LS.firstTry=false; buzz([30,40,30]);
        $("#fb").innerHTML=`<div class="feedback no"><b>Noch nicht.</b> Versuch es nochmal, du schaffst das.</div>`; }
    });
  }
  $("#next").onclick=()=>{
    if(LS.step<3){LS.step++;renderLesson(id);window.scrollTo({top:0,behavior:"smooth"});return;}
    if(LS.q<L.quiz.length-1){LS.q++;LS.answered=false;LS.firstTry=true;renderLesson(id);return;}
    finishLesson(id);
  };
}
function finishLesson(id){
  const L=LESSONS[id]; const first=!S.done[id];
  const gained=first?50+LS.correct*10:10;
  S.done[id]=true; L.terms.forEach(t=>{if(!S.cards[t]) S.cards[t]={box:0,due:today()};});

    <div style="width:100%;max-width:360px"><div class="row small"><span class="grow mono">Level ${level()}</span><span class="mono muted">${S.xp%200}/200</span></div><div class="bar" style="margin:8px 0 14px"><i id="rbar" style="width:0"></i></div>

    ${nb.map((b,i)=>`<div class="newbadge" style="animation-delay:${.3+i*.15}s"><span class="em">${b.em}</span><div><b>Abzeichen: ${esc(b.t)}</b><div class="small muted">Neu freigeschaltet</div></div></div>`).join("")}
    <div style="display:grid;gap:12px;margin-top:20px">${nx?`<button class="btn block" id="rNext">Nächste Lektion ${ic("arrow",'width="18" height="18"')}</button>`:""}<button class="btn ghost block" id="rBack">Zum Lernpfad</button></div></div>`;
  document.body.appendChild(o); confetti(); buzz([20,60,20]);
  setTimeout(()=>{const b=o.querySelector("#rbar"); if(b) b.style.width=levelPct()+"%";},250);

  o.querySelector("#rBack").onclick=()=>{close();go("learn");};

}

      <button class="btn ghost" id="again">Nochmal</button><button class="btn ok" id="know">Gewusst ✓</button></div>`;
  $("#flip").onclick=e=>{if(e.target.closest("#more"))return;flipped=!flipped;$("#flip").classList.toggle("flipped",flipped);renderReviewButtons();};
  $("#more").onclick=e=>{e.stopPropagation();openCard(id);};
  const rate=ok=>{
    const cur=S.cards[id]||{box:0}; const nb=ok?Math.min(cur.box+1,4):0;
    const days=[0,1,3,7,14][nb]; const d=new Date();d.setDate(d.getDate()+(ok?days:0));

/* Karte mit Nachfrage-Funktion */
function openCard(id){
  const C=CARDS[id]; const lesson=ALL.find(l=>LESSONS[l].terms.includes(id));
  const answers={a:["💡 So kannst du es dir vorstellen",C.a],e:["🔧 Beispiel aus der Praxis",C.e],w:["🎯 Warum das für dich wichtig ist",C.w]};
  openSheet(`<div class="label">Karte</div><h2 class="mono">${esc(C.t)}</h2><p style="font-size:17px;margin:0 0 6px">${esc(C.s)}</p>
    <div class="ask"><div class="small muted">Was möchtest du genauer wissen?</div>
      <div class="ask-chips"><button class="chip" data-k="a">Wie kann ich mir das vorstellen?</button><button class="chip" data-k="e">Gib mir ein Beispiel</button><button class="chip" data-k="w">Warum ist das wichtig?</button></div>
      <div class="row" style="gap:8px"><input class="field" id="askIn" placeholder="Eigene Frage stellen …"><button class="iconbtn" id="askGo" style="width:48px;height:48px;flex:none;background:var(--accent);color:#fff;border:0" aria-label="Fragen">${ic("arrow")}</button></div>
      <div id="ans"></div></div>
    <div style="display:grid;gap:10px;margin-top:18px">${lesson?`<button class="btn ghost block" id="toLesson">Zur Lektion: ${esc(LESSONS[lesson].title)}</button>`:""}<button class="btn block" id="cClose">Verstanden</button></div>`,
  s=>{
    const show=(keys,extra="")=>{s.querySelector("#ans").innerHTML=keys.map(k=>`<div class="answer"><div class="label">${answers[k][0]}</div>${esc(answers[k][1])}</div>`).join("")+extra;};
    s.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{s.querySelectorAll("[data-k]").forEach(x=>x.classList.toggle("on",x===b));show([b.dataset.k]);});
    const ask=()=>{const q=s.querySelector("#askIn").value.trim().toLowerCase(); if(!q) return;
      let keys=[];
      if(/vorstell|bild|analog|vergleich|wie kann|wie sieht|aussehen|verstehe nicht|erklär/.test(q)) keys.push("a");
      if(/beispiel|praxis|konkret|zeig|wo begegne|z\.\s?b/.test(q)) keys.push("e");
      if(/warum|wieso|wichtig|brauch|nutzen|wofür|bringt/.test(q)) keys.push("w");
      const prompt=`Ich lerne gerade Grundlagen für Vibecoding. Erkläre mir den Begriff „${C.t}“ (${C.s}) einfach und mit einem Alltagsvergleich. Meine Frage: ${s.querySelector("#askIn").value.trim()}`;
      const claude=`<div class="answer"><div class="label">Noch Fragen offen?</div>Für freie Fragen kopiert die App eine fertige Frage für Claude in deine Zwischenablage.<br><button class="chip" id="cp" style="margin-top:10px">${ic("copy",'width="16" height="16"')} Frage für Claude kopieren</button></div>`;
      show(keys.length?keys:["a","e","w"],claude);
      s.querySelector("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(prompt);toast("Kopiert – jetzt in Claude einfügen");}catch(e){toast("Kopieren nicht möglich");}};
    };
    s.querySelector("#askGo").onclick=ask; s.querySelector("#askIn").onkeydown=e=>{if(e.key==="Enter")ask();};
    s.querySelector("#cClose").onclick=()=>closeSheet();
    const tl=s.querySelector("#toLesson"); if(tl) tl.onclick=()=>{closeSheet();LS=null;go("learn",{type:"lesson",id:lesson});};
  });
}

  $("#imp").onclick=()=>$("#impFile").click();
  $("#impFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(fresh(),JSON.parse(r.result));save();applyTheme();toast("Import erfolgreich");render();}catch(err){toast("Datei konnte nicht gelesen werden");}};r.readAsText(f);};
  $("#reset").onclick=e=>{const b=e.currentTarget; if(b.dataset.sure){const th=S.theme;S=fresh();S.theme=th;save();toast("Zurückgesetzt");go("home");} else {b.dataset.sure="1";b.textContent="Sicher?";}};
}

/* =====================================================================
   APP-ICON für den Home-Bildschirm (wird aus Canvas erzeugt)
   ===================================================================== */
(function makeIcon(){try{
  const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,"#4f46e5");g.addColorStop(1,"#16a34a");
  x.fillStyle=g;x.fillRect(0,0,180,180);
  x.fillStyle="#fff";x.font="bold 72px Menlo, monospace";x.textAlign="center";x.textBaseline="middle";x.fillText("</>",90,94);
  const l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.appendChild(l);
  const f=document.createElement("link");f.rel="icon";f.href=l.href;document.head.appendChild(f);
}catch(e){}})();

/* Start */
touchDay(); save(); applyTheme(); render();
</script>
</body>
</html>
